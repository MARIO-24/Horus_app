name: horus_app
description: "HorusAPP - Tu entrenador personal inteligente"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.3.0

  # UI
  google_fonts: ^6.2.1

  # Utils
  intl: ^0.20.2
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  http: ^1.2.0
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "iconos/Logo_HorusApp.png"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "iconos/Logo_HorusApp.png"

flutter:
  uses-material-design: true

  assets:
    - iconos/
